apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmyshow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookmyshow
  template:
    metadata:
      labels:
        app: bookmyshow
    spec:
      containers:
        - name: bookmyshow
          image: bookmyshow-event:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: bookmyshow
spec:
  type: NodePort
  selector:
    app: bookmyshow
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32088
